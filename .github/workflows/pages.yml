name: Validate and publish portal

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  repository_dispatch:
    types: [firmware_released]
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build:meshcore
      - run: git diff --exit-code -- vendor/meshcore/meshcore.js
      - run: npm run check
      - run: npm test
      - run: node --check src/app.js
      - run: node --check src/analytics.js
      - run: node --check src/serial.js
      - run: node --check src/companion.js
      - run: node --check src/flasher.js
      - run: node --check vendor/meshcore-flasher/dfu.js

  build-site:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare static Pages artifact
        env:
          GOATCOUNTER_SITE_CODE: ${{ vars.GOATCOUNTER_SITE_CODE }}
        run: npm run build:site
      - name: Synchronize firmware releases
        env:
          FIRMWARE_REPOSITORY: roaridse/MeshCore-VictronBLE
          FIRMWARE_REPO_TOKEN: ${{ secrets.FIRMWARE_REPO_TOKEN || github.token }}
        run: npm run sync:firmware -- --site _site --keep 3
      - name: Validate synchronized site
        run: node scripts/check.mjs _site --site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build-site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
